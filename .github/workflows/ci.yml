# The gate every change goes through.
#
# Two halves, and both are needed:
#
# - `check` is typecheck + tests. ⚠️ `bun test` does not typecheck, so a test run
#   that passes says nothing about types — they are separate steps on purpose.
# - `image` builds the real image, starts it and runs `scripts/smoke.sh` against
#   it. 🔴 `/api/health` answering 200 is not evidence the app works: a client
#   bundle that fails to build leaves every route answering 200 while the page
#   is blank. The smoke test fetches the page *and* the script it references.
#
# arm64 runs natively (no QEMU) on GitHub's arm runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The build record build-push-action uploads by default counts against the
# Actions artifact quota, and on this account that quota is already full.
env:
  DOCKER_BUILD_RECORD_UPLOAD: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  image:
    name: Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: casatube:ci
          cache-from: type=gha,scope=ci-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.platform }}

      # Named `casatube` because smoke.sh reads that container's log for the
      # "bundle failed" line the HTTP checks cannot see.
      # A library is mounted because without one the library routes answer
      # 503 — on purpose: an unmounted /library would otherwise swallow
      # downloads into the container's writable layer.
      - name: Start
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/library"
          chmod 777 "$RUNNER_TEMP/data" "$RUNNER_TEMP/library"
          docker run -d --name casatube -p 8520:8520 \
            -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/library:/library" \
            casatube:ci
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8520/api/health && exit 0
            sleep 2
          done
          docker logs casatube
          exit 1

      - name: Smoke test
        run: ./scripts/smoke.sh http://127.0.0.1:8520

      - name: The baked-in yt-dlp runs on this architecture
        run: docker exec casatube /opt/yt-dlp/yt-dlp --version

      - name: Logs
        if: always()
        run: docker logs casatube 2>&1 | tail -100
